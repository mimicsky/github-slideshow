<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070b"/><stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#3b4a3a"/><stop offset="0.6" stop-color="#1c2620"/><stop offset="1" stop-color="#0a0e0c"/>
    </radialGradient>
    <linearGradient id="hullTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa1a9"/><stop offset="0.45" stop-color="#6c737b"/><stop offset="1" stop-color="#3a3f45"/>
    </linearGradient>
    <linearGradient id="hullLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6067"/><stop offset="1" stop-color="#2a2e33"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7aeb6"/><stop offset="1" stop-color="#5a6067"/>
    </linearGradient>
    <radialGradient id="thrust" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#e8f6ff"/><stop offset="0.35" stop-color="#6cb8ff"/><stop offset="1" stop-color="#2a6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWin" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a8"/><stop offset="1" stop-color="#ffb84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="viewport" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe2ff"/><stop offset="1" stop-color="#1b3b5a"/>
    </linearGradient>
  </defs>

  <!-- space -->
  <rect width="1200" height="760" fill="url(#space)"/>
  <g fill="#fff">
    <circle cx="80" cy="60" r="1.2"/><circle cx="210" cy="140" r="0.8"/><circle cx="330" cy="40" r="1"/>
    <circle cx="470" cy="110" r="0.7"/><circle cx="610" cy="30" r="1.3"/><circle cx="760" cy="90" r="0.8"/>
    <circle cx="890" cy="50" r="1"/><circle cx="1010" cy="130" r="0.7"/><circle cx="1130" cy="70" r="1.2"/>
    <circle cx="140" cy="620" r="0.9"/><circle cx="420" cy="690" r="1"/><circle cx="700" cy="660" r="0.7"/>
    <circle cx="980" cy="700" r="1.1"/><circle cx="1160" cy="600" r="0.8"/><circle cx="40" cy="380" r="0.8"/>
    <circle cx="560" cy="200" r="0.6"/><circle cx="1080" cy="240" r="0.7"/><circle cx="260" cy="560" r="0.6"/>
  </g>
  <!-- planet limb -->
  <circle cx="1080" cy="900" r="420" fill="url(#planet)"/>
  <path d="M660 900 A420 420 0 0 1 1500 900" fill="none" stroke="#6f9a7a" stroke-opacity="0.35" stroke-width="3"/>

  <!-- engine plumes (aft is left) -->
  <ellipse cx="130" cy="345" rx="120" ry="26" fill="url(#thrust)"/>
  <ellipse cx="130" cy="405" rx="120" ry="26" fill="url(#thrust)"/>

  <!-- engine block -->
  <path d="M190 300 L270 285 L270 455 L190 440 Z" fill="#4a5057" stroke="#c9d0d8" stroke-width="2"/>
  <rect x="172" y="325" width="22" height="40" rx="4" fill="#2a2e33" stroke="#8fd0ff" stroke-width="2"/>
  <rect x="172" y="385" width="22" height="40" rx="4" fill="#2a2e33" stroke="#8fd0ff" stroke-width="2"/>

  <!-- main hull (upper deck), prow points right -->
  <path d="M265 280 L900 280 L1010 320 L1090 372 L1010 412 L900 440 L265 455 Z" fill="url(#hullTop)" stroke="#c9d0d8" stroke-width="2"/>
  <!-- armour plate seams -->
  <g stroke="#3a3f45" stroke-width="1.5">
    <line x1="360" y1="282" x2="360" y2="453"/><line x1="470" y1="282" x2="470" y2="452"/>
    <line x1="580" y1="282" x2="580" y2="450"/><line x1="690" y1="282" x2="690" y2="448"/>
    <line x1="800" y1="282" x2="800" y2="445"/><line x1="900" y1="282" x2="900" y2="440"/>
  </g>
  <!-- prow ram -->
  <path d="M1010 320 L1090 372 L1010 412 L1040 372 Z" fill="#3a3f45" stroke="#c9d0d8" stroke-width="1.5"/>

  <!-- white stripes -->
  <path d="M265 300 L905 300 L1000 334" fill="none" stroke="#f4f4f4" stroke-width="7"/>
  <path d="M265 432 L905 420 L1000 398" fill="none" stroke="#f4f4f4" stroke-width="4"/>
  <rect x="236" y="290" width="10" height="160" fill="#f4f4f4" transform="skewX(-6)"/>

  <!-- bridge superstructure, forward and up -->
  <path d="M780 280 L800 220 L930 220 L965 280 Z" fill="url(#tower)" stroke="#c9d0d8" stroke-width="2"/>
  <path d="M905 232 L928 232 L952 270 L922 270 Z" fill="url(#viewport)" stroke="#7fd1ff" stroke-width="1.5"/>
  <rect x="800" y="234" width="90" height="10" fill="#f4f4f4"/>
  <line x1="845" y1="220" x2="845" y2="186" stroke="#c9d0d8" stroke-width="3"/>
  <line x1="845" y1="196" x2="870" y2="196" stroke="#c9d0d8" stroke-width="2"/>
  <circle cx="845" cy="184" r="4" fill="#e04b3c"/>
  <!-- augur dish -->
  <path d="M760 280 Q770 252 798 256" fill="none" stroke="#c9d0d8" stroke-width="3"/>

  <!-- lit portholes (upper deck) -->
  <g>
    <circle cx="400" cy="318" r="9" fill="url(#glowWin)"/><circle cx="400" cy="318" r="3.2" fill="#ffd27a"/>
    <circle cx="440" cy="318" r="9" fill="url(#glowWin)"/><circle cx="440" cy="318" r="3.2" fill="#ffd27a"/>
    <circle cx="620" cy="318" r="9" fill="url(#glowWin)"/><circle cx="620" cy="318" r="3.2" fill="#ffd27a"/>
    <circle cx="660" cy="318" r="9" fill="url(#glowWin)"/><circle cx="660" cy="318" r="3.2" fill="#ffd27a"/>
    <circle cx="740" cy="318" r="9" fill="url(#glowWin)"/><circle cx="740" cy="318" r="3.2" fill="#ffd27a"/>
    <circle cx="860" cy="318" r="9" fill="url(#glowWin)"/><circle cx="860" cy="318" r="3.2" fill="#ffd27a"/>
  </g>

  <!-- ship name, hull side -->
  <text x="610" y="370" fill="#f4f4f4" font-size="30" font-weight="bold" letter-spacing="6" text-anchor="middle">THE BRIGHT LIGHT</text>
  <!-- Inquisition I -->
  <g transform="translate(930 372)">
    <rect x="-5" y="-24" width="10" height="48" fill="#f4f4f4"/>
    <rect x="-14" y="-24" width="28" height="6" fill="#f4f4f4"/>
    <rect x="-14" y="18" width="28" height="6" fill="#f4f4f4"/>
  </g>

  <!-- drop-pod side compartment (open, port flank, aft) -->
  <rect x="280" y="388" width="200" height="40" fill="#1a1d21" stroke="#f4f4f4" stroke-width="2"/>
  <g>
    <path d="M300 424 L300 404 Q315 390 330 404 L330 424 Z" fill="#7a8088" stroke="#f4f4f4" stroke-width="1.5"/>
    <path d="M365 424 L365 404 Q380 390 395 404 L395 424 Z" fill="#7a8088" stroke="#f4f4f4" stroke-width="1.5"/>
    <path d="M430 424 L430 404 Q445 390 460 404 L460 424 Z" fill="#7a8088" stroke="#f4f4f4" stroke-width="1.5"/>
    <rect x="310" y="410" width="10" height="3" fill="#f4f4f4"/><rect x="375" y="410" width="10" height="3" fill="#f4f4f4"/><rect x="440" y="410" width="10" height="3" fill="#f4f4f4"/>
  </g>
  <!-- hazard lip on the pod bay -->
  <g fill="#d9a441"><rect x="280" y="384" width="16" height="4"/><rect x="312" y="384" width="16" height="4"/><rect x="344" y="384" width="16" height="4"/><rect x="376" y="384" width="16" height="4"/><rect x="408" y="384" width="16" height="4"/><rect x="440" y="384" width="16" height="4"/><rect x="472" y="384" width="8" height="4"/></g>

  <!-- small lower deck (ventral keel) -->
  <path d="M330 455 L760 446 L800 470 L760 500 L350 505 L320 480 Z" fill="url(#hullLow)" stroke="#c9d0d8" stroke-width="2"/>
  <path d="M340 492 L770 486" stroke="#f4f4f4" stroke-width="3"/>
  <!-- forge vent glow -->
  <rect x="420" y="466" width="40" height="12" rx="2" fill="#ff7a2a"/>
  <rect x="420" y="466" width="40" height="12" rx="2" fill="none" stroke="#ffb07a"/>
  <!-- plasma charging vent glow -->
  <rect x="640" y="464" width="34" height="12" rx="2" fill="#4ad0ff"/>
  <!-- cell slits -->
  <rect x="540" y="468" width="6" height="12" fill="#111"/><rect x="560" y="468" width="6" height="12" fill="#111"/>


  <!-- labels -->
  <g stroke="#bbb" stroke-width="1">
    <line x1="928" y1="248" x2="1000" y2="190"/>
    <line x1="380" y1="428" x2="250" y2="560"/>
    <line x1="440" y1="478" x2="440" y2="560"/>
    <line x1="657" y1="476" x2="760" y2="560"/>
    <line x1="553" y1="480" x2="580" y2="560"/>
    <line x1="600" y1="282" x2="600" y2="240"/>
    <line x1="180" y1="375" x2="110" y2="640"/>
  </g>
  <g fill="#e6e6e6" font-size="17">
    <text x="1005" y="186">Bridge + viewport</text>
    <text x="250" y="582" text-anchor="middle">Drop-pod bay</text>
    <text x="250" y="602" text-anchor="middle" fill="#aaa" font-size="14">side hatches, aft</text>
    <text x="440" y="582" text-anchor="middle">Dace's forge</text>
    <text x="440" y="602" text-anchor="middle" fill="#aaa" font-size="14">lower deck</text>
    <text x="770" y="582">Tech-priest's workshop</text>
    <text x="770" y="602" fill="#aaa" font-size="14">plasma + las charging</text>
    <text x="590" y="582" text-anchor="middle">2 cells</text>
    <text x="600" y="212" text-anchor="middle">Hold: 2 containers</text>
    <text x="600" y="232" text-anchor="middle" fill="#aaa" font-size="14">+ range, upper deck</text>
    <text x="110" y="662" text-anchor="middle">Refitted drives</text>
    <text x="110" y="682" text-anchor="middle" fill="#aaa" font-size="14">a little faster</text>
  </g>

  <!-- title -->
  <text x="40" y="60" fill="#f4f4f4" font-size="34" font-weight="bold" letter-spacing="3">THE BRIGHT LIGHT</text>
  <text x="40" y="88" fill="#9aa1a9" font-size="17">ex-Ember of Tyrok · Interrogator Rook's courier · ~100 m · port side</text>
  <text x="40" y="720" fill="#9fe0b4" font-size="16">Grey hull, white stripes. Upper deck: the original layout. Lower deck: forge, cells, workshop.</text>
  <text x="40" y="742" fill="#666" font-size="13">Not to scale.</text>
</svg>
