<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" font-family="Arial, sans-serif">
  <rect width="400" height="640" fill="#1b1d21"/>
  <!-- chapel -->
  <rect x="120" y="20" width="160" height="120" fill="#4a3f52" stroke="#bbb" stroke-width="2"/>
  <text x="200" y="40" fill="#e6dcf0" font-size="13" text-anchor="middle">CHAPEL</text>
  <rect x="170" y="60" width="60" height="22" fill="#9a8f80" transform="rotate(12 200 71)"/>
  <text x="200" y="100" fill="#e6dcf0" font-size="10" text-anchor="middle">altar stone, levered up</text>
  <circle cx="175" cy="120" r="8" fill="#d9534f" stroke="#fff"/><circle cx="225" cy="120" r="8" fill="#d9534f" stroke="#fff"/>
  <text x="200" y="136" fill="#ffb3ad" font-size="9" text-anchor="middle">2 troopers prying floor</text>
  <!-- archway -->
  <rect x="175" y="140" width="50" height="10" fill="#1b1d21"/>
  <text x="250" y="152" fill="#bbb" font-size="9">archway</text>
  <!-- sitting room -->
  <rect x="40" y="150" width="320" height="300" fill="#3a3d43" stroke="#bbb" stroke-width="2"/>
  <rect x="175" y="148" width="50" height="6" fill="#3a3d43"/>
  <text x="200" y="440" fill="#ccc" font-size="12" text-anchor="middle">SITTING ROOM (wrecked)</text>
  <!-- furniture -->
  <rect x="50" y="160" width="14" height="110" fill="#6b5a44"/><text x="70" y="215" fill="#eee" font-size="9">fallen shelves</text>
  <rect x="90" y="300" width="60" height="26" fill="#6b5a44" transform="rotate(-20 120 313)"/><text x="120" y="345" fill="#eee" font-size="9" text-anchor="middle">desk on its side</text>
  <rect x="250" y="175" width="34" height="30" fill="#6b5a44"/><text x="267" y="220" fill="#eee" font-size="9" text-anchor="middle">armchair</text>
  <!-- sergeant + stubber -->
  <circle cx="300" cy="190" r="9" fill="#d9534f" stroke="#fff" stroke-width="2"/>
  <text x="300" y="194" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">K</text>
  <line x1="300" y1="190" x2="345" y2="230" stroke="#ffcc66" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="300" y="168" fill="#ffb3ad" font-size="9" text-anchor="middle">sergeant + heavy stubber</text>
  <!-- side door -->
  <rect x="356" y="225" width="8" height="40" fill="#c9a24a"/>
  <text x="352" y="280" fill="#e6d29a" font-size="9" text-anchor="end">side door (stubber aimed here)</text>
  <!-- other rooms -->
  <rect x="36" y="350" width="8" height="40" fill="#c9a24a"/>
  <text x="52" y="402" fill="#e6d29a" font-size="9">door to other rooms</text>
  <text x="52" y="414" fill="#aaa" font-size="9">(men heard, not seen)</text>
  <!-- tessaly -->
  <circle cx="210" cy="290" r="11" fill="#b02a2a" stroke="#fff" stroke-width="2"/>
  <text x="210" y="294" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">T</text>
  <text x="228" y="294" fill="#ffb3ad" font-size="10">Tessaly (pacing,</text>
  <text x="228" y="306" fill="#ffb3ad" font-size="10">plasma pistol)</text>
  <!-- double doors -->
  <rect x="170" y="446" width="60" height="8" fill="#1b1d21"/>
  <rect x="170" y="446" width="22" height="8" fill="#c9a24a"/>
  <text x="250" y="470" fill="#e6d29a" font-size="9">double doors, one ajar</text>
  <!-- corridor -->
  <rect x="20" y="460" width="360" height="130" fill="#5a2f2f" stroke="#888"/>
  <text x="200" y="580" fill="#e8cfcf" font-size="11" text-anchor="middle">OFFICERS' CORRIDOR (carpet)</text>
  <!-- you + sentry -->
  <circle cx="150" cy="480" r="9" fill="#3fbf6a" stroke="#fff" stroke-width="2"/><text x="150" y="484" fill="#000" font-size="9" font-weight="bold" text-anchor="middle">R</text>
  <rect x="160" y="475" width="11" height="11" fill="#e8c547"/>
  <text x="110" y="500" fill="#9fe0b4" font-size="9" text-anchor="middle">you + sentry</text>
  <!-- alcoves -->
  <rect x="250" y="470" width="30" height="16" fill="#2a1a1a" stroke="#888"/>
  <circle cx="258" cy="478" r="6" fill="#3fbf6a" stroke="#fff"/><circle cx="273" cy="478" r="6" fill="#3fbf6a" stroke="#fff"/>
  <text x="300" y="500" fill="#9fe0b4" font-size="9" text-anchor="middle">Varga, Varsaine</text>
  <rect x="300" y="530" width="40" height="16" fill="#2a1a1a" stroke="#888"/>
  <circle cx="310" cy="538" r="6" fill="#3fbf6a" stroke="#fff"/><circle cx="328" cy="538" r="6" fill="#3fbf6a" stroke="#fff"/>
  <text x="320" y="560" fill="#9fe0b4" font-size="9" text-anchor="middle">Isk, Brenner</text>
  <!-- legend -->
  <circle cx="30" cy="608" r="6" fill="#3fbf6a" stroke="#fff"/><text x="40" y="612" fill="#ddd" font-size="10">your team (R = you)</text>
  <circle cx="180" cy="608" r="6" fill="#d9534f" stroke="#fff"/><text x="190" y="612" fill="#ddd" font-size="10">enemy seen</text>
  <rect x="270" y="602" width="11" height="11" fill="#e8c547"/><text x="286" y="612" fill="#ddd" font-size="10">captured sentry</text>
  <text x="200" y="632" fill="#999" font-size="9" text-anchor="middle">Strahn's quarters, level nine, top-down. Not to scale.</text>
</svg>
