<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" font-family="Arial, sans-serif">
  <rect width="400" height="600" fill="#101214"/>
  <g fill="#22262b" stroke="#6f7782" stroke-width="2">
    <rect x="200" y="20" width="150" height="100"/>   <!-- chapel -->
    <rect x="150" y="120" width="230" height="230"/>  <!-- sitting room -->
    <rect x="20" y="120" width="130" height="110"/>   <!-- study -->
    <rect x="20" y="230" width="130" height="120"/>   <!-- bedroom -->
    <rect x="20" y="380" width="360" height="90"/>    <!-- corridor -->
  </g>
  <!-- doorways -->
  <g fill="#22262b">
    <rect x="252" y="116" width="46" height="8"/>  <!-- archway -->
    <rect x="146" y="160" width="8" height="34"/>  <!-- study door -->
    <rect x="146" y="280" width="8" height="34"/>  <!-- bedroom door -->
    <rect x="240" y="346" width="60" height="38"/> <!-- double doors -->
  </g>
  <rect x="376" y="200" width="8" height="34" fill="#c9a24a"/>
  <g fill="#9aa3ad" font-size="11" text-anchor="middle">
    <text x="275" y="38">CHAPEL</text>
    <text x="265" y="340">SITTING ROOM</text>
    <text x="85" y="138">STUDY</text>
    <text x="85" y="248">BEDROOM</text>
    <text x="200" y="462">CORRIDOR</text>
  </g>
  <text x="372" y="250" fill="#c9a24a" font-size="9" text-anchor="end">side door</text>
  <!-- cover -->
  <g fill="#4a4036">
    <rect x="300" y="150" width="28" height="24"/>
    <rect x="190" y="255" width="50" height="20" transform="rotate(-20 215 265)"/>
    <rect x="158" y="128" width="10" height="70"/>
  </g>
  <!-- stubber line of fire -->
  <line x1="338" y1="170" x2="378" y2="215" stroke="#ff5a4f" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- enemies -->
  <g stroke="#fff" stroke-width="1.5">
    <circle cx="255" cy="80" r="9" fill="#e53935"/>
    <circle cx="295" cy="80" r="9" fill="#e53935"/>
    <circle cx="338" cy="168" r="10" fill="#e53935"/>
    <circle cx="265" cy="230" r="11" fill="#8e0000"/>
    <circle cx="65" cy="175" r="9" fill="#e53935" fill-opacity="0.55" stroke-dasharray="3 2"/>
    <circle cx="110" cy="195" r="9" fill="#e53935" fill-opacity="0.55" stroke-dasharray="3 2"/>
    <circle cx="65" cy="295" r="9" fill="#e53935" fill-opacity="0.55" stroke-dasharray="3 2"/>
    <circle cx="110" cy="315" r="9" fill="#e53935" fill-opacity="0.55" stroke-dasharray="3 2"/>
  </g>
  <g fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">
    <text x="255" y="84">1</text><text x="295" y="84">2</text><text x="338" y="172">K</text><text x="265" y="234">T</text>
    <text x="65" y="179">3</text><text x="110" y="199">4</text><text x="65" y="299">5</text><text x="110" y="319">6</text>
  </g>
  <!-- knocked out sentry -->
  <g stroke="#888" stroke-width="3"><line x1="44" y1="398" x2="56" y2="410"/><line x1="56" y1="398" x2="44" y2="410"/></g>
  <!-- your team -->
  <g stroke="#fff" stroke-width="1.5" fill="#2ecc71">
    <circle cx="228" cy="400" r="10"/>
    <circle cx="228" cy="422" r="8"/>
    <circle cx="312" cy="400" r="8"/>
    <circle cx="270" cy="440" r="8"/>
    <circle cx="295" cy="450" r="8"/>
  </g>
  <g fill="#000" font-size="9" font-weight="bold" text-anchor="middle">
    <text x="228" y="404">R</text><text x="228" y="425">Vg</text><text x="312" y="403">Vs</text><text x="270" y="443">I</text><text x="295" y="453">B</text>
  </g>
  <!-- legend -->
  <g font-size="11" fill="#ddd">
    <circle cx="30" cy="495" r="7" fill="#8e0000" stroke="#fff"/><text x="44" y="499">T  Tessaly (plasma pistol)</text>
    <circle cx="30" cy="515" r="7" fill="#e53935" stroke="#fff"/><text x="44" y="519">K  Sgt Kade (heavy stubber, aimed at side door)</text>
    <circle cx="30" cy="535" r="7" fill="#e53935" stroke="#fff"/><text x="44" y="539">1-2  troopers prying chapel floor</text>
    <circle cx="30" cy="555" r="7" fill="#e53935" fill-opacity="0.55" stroke="#fff" stroke-dasharray="3 2"/><text x="44" y="559">3-6  searching study/bedroom (not seen; sentry's word)</text>
    <circle cx="30" cy="575" r="7" fill="#2ecc71" stroke="#fff"/><text x="44" y="579">R you, Vg Varga, Vs Varsaine, I Isk, B Brenner</text>
  </g>
  <text x="200" y="596" fill="#666" font-size="9" text-anchor="middle">8 enemies inside. X = knocked-out sentry.</text>
</svg>
