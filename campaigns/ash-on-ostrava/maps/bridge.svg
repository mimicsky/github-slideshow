<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700" font-family="Arial, sans-serif">
  <rect width="400" height="700" fill="#101214"/>
  <text x="200" y="22" fill="#e6e6e6" font-size="14" font-weight="bold" text-anchor="middle">BRIDGE OF THE GATE UNBROKEN</text>
  <text x="200" y="37" fill="#888" font-size="9.5" text-anchor="middle">Top-down. ~40 m long. Doors at the bottom</text>
  <!-- viewport -->
  <rect x="60" y="50" width="280" height="16" fill="#1b3b5a" stroke="#7fd1ff"/>
  <text x="200" y="62" fill="#cfe9ff" font-size="9.5" text-anchor="middle">ARMOURED VIEWPORT (space, Lantern, Iron Litany)</text>
  <!-- deck -->
  <rect x="40" y="66" width="320" height="520" fill="#22262b" stroke="#6f7782" stroke-width="2"/>
  <!-- pillars / arches -->
  <g fill="#3a3f46" stroke="#888"><rect x="120" y="190" width="16" height="16"/><rect x="264" y="190" width="16" height="16"/><rect x="120" y="330" width="16" height="16"/><rect x="264" y="330" width="16" height="16"/><rect x="120" y="470" width="16" height="16"/><rect x="264" y="470" width="16" height="16"/></g>
  <!-- command pits -->
  <rect x="48" y="160" width="64" height="360" fill="#191c20" stroke="#555"/>
  <rect x="288" y="160" width="64" height="360" fill="#191c20" stroke="#555"/>
  <g fill="#2d4a3a"><rect x="54" y="180" width="52" height="14"/><rect x="54" y="250" width="52" height="14"/><rect x="54" y="320" width="52" height="14"/><rect x="54" y="390" width="52" height="14"/><rect x="54" y="460" width="52" height="14"/>
  <rect x="294" y="180" width="52" height="14"/><rect x="294" y="250" width="52" height="14"/><rect x="294" y="320" width="52" height="14"/><rect x="294" y="390" width="52" height="14"/><rect x="294" y="460" width="52" height="14"/></g>
  <text x="80" y="155" fill="#9aa" font-size="9" text-anchor="middle">COMMAND PIT</text>
  <text x="320" y="155" fill="#9aa" font-size="9" text-anchor="middle">COMMAND PIT</text>
  <text x="80" y="535" fill="#9aa" font-size="8.5" text-anchor="middle">(steps down,</text>
  <text x="80" y="546" fill="#9aa" font-size="8.5" text-anchor="middle">consoles = cover)</text>
  <!-- crew (grey) -->
  <g fill="#9aa3ad"><circle cx="70" cy="203" r="4"/><circle cx="92" cy="273" r="4"/><circle cx="66" cy="343" r="4"/><circle cx="96" cy="413" r="4"/><circle cx="74" cy="483" r="4"/><circle cx="310" cy="203" r="4"/><circle cx="334" cy="273" r="4"/><circle cx="306" cy="343" r="4"/><circle cx="330" cy="413" r="4"/><circle cx="318" cy="483" r="4"/></g>
  <!-- dais & throne -->
  <rect x="140" y="80" width="120" height="70" fill="#4a3a22" stroke="#d9a441" stroke-width="2"/>
  <text x="300" y="100" fill="#e6d29a" font-size="9" text-anchor="middle">ARMOURED</text><text x="300" y="111" fill="#e6d29a" font-size="9" text-anchor="middle">DAIS (raised)</text>
  <rect x="186" y="90" width="28" height="22" fill="#7a5a2a" stroke="#d9a441"/>
  <text x="200" y="104" fill="#fff" font-size="8" text-anchor="middle">throne</text>
  <!-- drachen -->
  <circle cx="232" cy="110" r="11" fill="#8e0000" stroke="#fff" stroke-width="2"/>
  <text x="232" y="114" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">D</text>
  <!-- bodyguards -->
  <g stroke="#fff" stroke-width="1.5" fill="#e53935"><circle cx="152" cy="138" r="8"/><circle cx="174" cy="140" r="8"/><circle cx="226" cy="140" r="8"/><circle cx="248" cy="138" r="8"/></g>
  <!-- doors -->
  <rect x="160" y="582" width="80" height="10" fill="#d9a441"/>
  <text x="200" y="606" fill="#e6d29a" font-size="9.5" text-anchor="middle">GILDED DOORS (open)</text>
  <!-- light -->
  <rect x="180" y="552" width="40" height="8" fill="#9aa3ad" stroke="#fff"/>
  <g stroke="#fff" stroke-width="1.5">
    <circle cx="200" cy="568" r="8" fill="#2ecc71"/>
    <circle cx="182" cy="574" r="8" fill="#2ecc71"/>
    <circle cx="218" cy="574" r="7" fill="#f0a030"/>
  </g>
  <g fill="#000" font-size="8.5" font-weight="bold" text-anchor="middle"><text x="200" y="571">Dc</text><text x="182" y="577">R</text><text x="218" y="577">Cv</text></g>
  <g fill="#2ecc71" stroke="#fff"><circle cx="170" cy="630" r="6"/><circle cx="188" cy="632" r="6"/><circle cx="212" cy="632" r="6"/><circle cx="230" cy="630" r="6"/><circle cx="160" cy="650" r="6"/><circle cx="180" cy="652" r="6"/><circle cx="220" cy="652" r="6"/><circle cx="240" cy="650" r="6"/></g>
  <text x="200" y="668" fill="#9fe0b4" font-size="9" text-anchor="middle">the rest of the Light, antechamber</text>
  <g font-size="9" fill="#ddd" text-anchor="middle">
    <text x="200" y="682">D = Drachen (bolt pistol + power sabre) · red = 4 Gate Guard · grey = cowering crew</text>
  </g>
  <text x="200" y="695" fill="#666" font-size="9" text-anchor="middle">R you, Dc Dace (shield), Cv Corvane. Not to scale.</text>
</svg>
