<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" font-family="Arial, sans-serif">
  <rect width="400" height="640" fill="#101214"/>
  <text x="200" y="26" fill="#ddd" font-size="14" text-anchor="middle" font-weight="bold">THE LIGHT'S CONTAINER</text>
  <text x="200" y="42" fill="#888" font-size="10" text-anchor="middle">LOT 4471-B · ~12 m · Deck 9 · top-down, doors at the bottom</text>
  <!-- container shell -->
  <rect x="110" y="55" width="180" height="520" fill="#2b2f2a" stroke="#7c8a6a" stroke-width="3"/>
  <!-- empty back -->
  <rect x="113" y="58" width="174" height="330" fill="#22261f"/>
  <text x="200" y="215" fill="#6f7a62" font-size="13" text-anchor="middle">EMPTY</text>
  <text x="200" y="232" fill="#6f7a62" font-size="10" text-anchor="middle">back two-thirds</text>
  <line x1="113" y1="388" x2="287" y2="388" stroke="#7c8a6a" stroke-dasharray="4 3"/>
  <!-- rack along left wall -->
  <rect x="114" y="395" width="26" height="170" fill="#5d4a35"/>
  <text x="127" y="480" fill="#f1e2c8" font-size="9" text-anchor="middle" transform="rotate(-90 127 480)">YOUR WEAPON RACK</text>
  <!-- right wall stacks -->
  <rect x="258" y="395" width="28" height="60" fill="#6b5a44"/>
  <rect x="258" y="460" width="28" height="50" fill="#4f5d44"/>
  <rect x="258" y="515" width="28" height="50" fill="#6b5a44"/>
  <!-- middle floor -->
  <rect x="150" y="400" width="48" height="26" fill="#6b5a44"/>
  <rect x="205" y="400" width="44" height="26" fill="#4f5d44"/>
  <rect x="150" y="436" width="98" height="16" fill="#3e3f45"/>
  <rect x="150" y="462" width="40" height="22" fill="#7a3b2e"/>
  <rect x="198" y="462" width="50" height="22" fill="#6b5a44"/>
  <rect x="150" y="494" width="98" height="26" fill="#4f5d44"/>
  <!-- doors -->
  <rect x="110" y="572" width="180" height="8" fill="#c9a24a"/>
  <text x="200" y="596" fill="#e6d29a" font-size="11" text-anchor="middle">DOORS · "PROPERTY OF THE LIGHT" · padlock</text>
  <!-- numbered callouts -->
  <g fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">
    <circle cx="127" cy="405" r="8" fill="#2e7dd7"/><text x="127" y="409">1</text>
    <circle cx="272" cy="425" r="8" fill="#2e7dd7"/><text x="272" y="429">2</text>
    <circle cx="272" cy="485" r="8" fill="#2e7dd7"/><text x="272" y="489">3</text>
    <circle cx="272" cy="540" r="8" fill="#2e7dd7"/><text x="272" y="544">4</text>
    <circle cx="174" cy="413" r="8" fill="#2e7dd7"/><text x="174" y="417">5</text>
    <circle cx="227" cy="413" r="8" fill="#2e7dd7"/><text x="227" y="417">6</text>
    <circle cx="199" cy="444" r="8" fill="#2e7dd7"/><text x="199" y="448">7</text>
    <circle cx="170" cy="473" r="8" fill="#2e7dd7"/><text x="170" y="477">8</text>
    <circle cx="223" cy="473" r="8" fill="#2e7dd7"/><text x="223" y="477">9</text>
    <circle cx="199" cy="507" r="8" fill="#2e7dd7"/><text x="199" y="511">10</text>
  </g>
  <!-- legend left -->
  <g fill="#ddd" font-size="8.5">
    <text x="8" y="70">1 Rack: Vigil, Shameholder,</text>
    <text x="8" y="81">   armour, 7 lasguns, Kantrael</text>
    <text x="8" y="97">2 ~320 shotgun shells</text>
    <text x="8" y="113">3 ~25 flak coats,</text>
    <text x="8" y="124">   ~25 visored helmets</text>
    <text x="8" y="140">4 ~21 vox-beads, Navy</text>
    <text x="8" y="151">   cutting torch, medi-kit</text>
    <text x="8" y="167">5 Crate: 13 las packs</text>
    <text x="8" y="183">6 Ammo box: grenades</text>
    <text x="8" y="194">   (2 impact, 5 frag, smoke)</text>
    <text x="8" y="210">7 Heavy stubber + 1 belt</text>
    <text x="8" y="226">8 Loot: ring, chrono,</text>
    <text x="8" y="237">   3 knives, lho tin, flask,</text>
    <text x="8" y="248">   stub revolver, tool roll,</text>
    <text x="8" y="259">   crew chits</text>
    <text x="8" y="275">9 Shotgun scrap</text>
    <text x="8" y="291">10 Space for Hollis's</text>
    <text x="8" y="302">   5 lasguns</text>
  </g>
  <g fill="#9fe0b4" font-size="9">
    <text x="300" y="70">ON YOU:</text>
    <text x="300" y="84">Last Word</text>
    <text x="300" y="96">Plasma pistol</text>
    <text x="300" y="108">  (4 shots)</text>
    <text x="300" y="120">Bolt pistol</text>
    <text x="300" y="132">  (3 + 7)</text>
    <text x="300" y="144">Tessaly's slate</text>
    <text x="300" y="156">  + rank pins</text>
    <text x="300" y="168">Captain's log</text>
    <text x="300" y="180">Bridge charts</text>
    <text x="300" y="192">  + 3 slates</text>
    <text x="300" y="204">6 Navy tokens</text>
    <text x="300" y="216">Ember rune-key</text>
    <text x="300" y="228">Warrant + key</text>
  </g>
  <text x="200" y="625" fill="#666" font-size="9" text-anchor="middle">Not to scale.</text>
</svg>
