    <line x1="215" y1="118" x2="290" y2="118"/>
    <line x1="211" y1="230" x2="290" y2="230"/>
    <line x1="211" y1="290" x2="290" y2="290"/>
    <line x1="150" y1="304" x2="120" y2="304"/>
    <line x1="138" y1="400" x2="120" y2="400"/>
    <line x1="262" y1="400" x2="290" y2="400"/>
    <line x1="159" y1="470" x2="120" y2="470"/>
    <line x1="172" y1="530" x2="120" y2="530"/>
    <line x1="228" y1="530" x2="290" y2="530"/>
    <line x1="224" y1="589" x2="290" y2="589"/>
