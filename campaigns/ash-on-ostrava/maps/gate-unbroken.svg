<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="hull" x1="0" x2="1">
      <stop offset="0" stop-color="#3d424a"/><stop offset="0.5" stop-color="#6c737d"/><stop offset="1" stop-color="#3d424a"/>
    </linearGradient>
    <radialGradient id="eng" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#bfe4ff"/><stop offset="0.5" stop-color="#4aa3ff"/><stop offset="1" stop-color="#4aa3ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="820" fill="#07090c"/>
  <g fill="#fff" opacity="0.6"><circle cx="30" cy="40" r="1"/><circle cx="360" cy="90" r="1"/><circle cx="60" cy="300" r="0.8"/><circle cx="350" cy="420" r="1"/><circle cx="25" cy="600" r="0.8"/><circle cx="370" cy="700" r="1"/><circle cx="330" cy="250" r="0.6"/></g>
  <text x="200" y="22" fill="#e6e6e6" font-size="14" font-weight="bold" text-anchor="middle">GATE UNBROKEN</text>
  <text x="200" y="37" fill="#999" font-size="9.5" text-anchor="middle">Lance cruiser, ~5 km, ~2,000 crew. Top-down, prow up. Standard-pattern layout</text>
  <!-- engine plumes -->
  <ellipse cx="170" cy="770" rx="16" ry="40" fill="url(#eng)"/><ellipse cx="200" cy="775" rx="18" ry="45" fill="url(#eng)"/><ellipse cx="230" cy="770" rx="16" ry="40" fill="url(#eng)"/>
  <!-- hull -->
  <path d="M200 50 L232 110 L240 160 L246 300 L262 330 L262 470 L246 500 L246 640 L258 660 L258 730 L142 730 L142 660 L154 640 L154 500 L138 470 L138 330 L154 300 L160 160 L168 110 Z" fill="url(#hull)" stroke="#9aa3ad" stroke-width="1.5"/>
  <!-- prow ram -->
  <path d="M200 50 L222 100 L178 100 Z" fill="#8a7a5a" stroke="#c9b27a"/>
  <!-- gothic spine & spires -->
  <rect x="194" y="110" width="12" height="560" fill="#2a2e34"/>
  <g fill="#555c66" stroke="#9aa3ad" stroke-width="0.6">
    <path d="M200 175 l6 -14 l6 14 z"/><path d="M188 175 l6 -14 l6 14 z"/>
  </g>
  <!-- broadside batteries -->
  <g fill="#c94a3d"><rect x="138" y="335" width="6" height="130"/><rect x="256" y="335" width="6" height="130"/></g>
  <g stroke="#1b1d21" stroke-width="2"><line x1="138" y1="350" x2="144" y2="350"/><line x1="138" y1="370" x2="144" y2="370"/><line x1="138" y1="390" x2="144" y2="390"/><line x1="138" y1="410" x2="144" y2="410"/><line x1="138" y1="430" x2="144" y2="430"/><line x1="138" y1="450" x2="144" y2="450"/><line x1="256" y1="350" x2="262" y2="350"/><line x1="256" y1="370" x2="262" y2="370"/><line x1="256" y1="390" x2="262" y2="390"/><line x1="256" y1="410" x2="262" y2="410"/><line x1="256" y1="430" x2="262" y2="430"/><line x1="256" y1="450" x2="262" y2="450"/></g>
  <!-- dorsal lance turrets -->
  <g fill="#6a4a8a" stroke="#c7a7ff"><circle cx="200" cy="230" r="11"/><circle cx="200" cy="290" r="11"/></g>
  <g stroke="#c7a7ff" stroke-width="3"><line x1="200" y1="230" x2="200" y2="210"/><line x1="200" y1="290" x2="200" y2="270"/></g>
  <!-- torpedo tubes -->
  <g fill="#1b1d21"><rect x="186" y="112" width="6" height="12"/><rect x="208" y="112" width="6" height="12"/></g>
  <!-- hangar bays -->
  <rect x="150" y="505" width="22" height="50" fill="#d9a441" stroke="#fff"/><rect x="228" y="505" width="22" height="50" fill="#d9a441" stroke="#fff"/>
  <!-- bridge tower -->
  <rect x="176" y="570" width="48" height="70" fill="#4b5563" stroke="#e6e6e6"/>
  <rect x="186" y="580" width="28" height="18" fill="#7fd1ff" opacity="0.7"/>
  <!-- lord-general's quarters -->
  <rect x="180" y="612" width="40" height="22" fill="#7a2f2f" stroke="#ffb3a8"/>
  <!-- shield gens -->
  <g fill="#2e7dd7"><circle cx="165" cy="470" r="6"/><circle cx="235" cy="470" r="6"/></g>
  <!-- airlocks -->
  <g fill="#3fbf6a" stroke="#fff"><rect x="150" y="300" width="8" height="8"/><rect x="242" y="300" width="8" height="8"/><rect x="143" y="660" width="8" height="8"/><rect x="249" y="660" width="8" height="8"/></g>
  <!-- enginarium -->
  <rect x="150" y="680" width="100" height="45" fill="#3a2e22" stroke="#d9a441"/>
  <!-- callouts -->
  <g font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="200" cy="80" r="8" fill="#000" stroke="#fff"/><text x="200" y="84">1</text>
    <circle cx="225" cy="118" r="8" fill="#000" stroke="#fff"/><text x="225" y="122">2</text>
    <circle cx="222" cy="260" r="8" fill="#000" stroke="#fff"/><text x="222" y="264">3</text>
    <circle cx="275" cy="400" r="8" fill="#000" stroke="#fff"/><text x="275" y="404">4</text>
    <circle cx="200" cy="470" r="8" fill="#000" stroke="#fff"/><text x="200" y="474">5</text>
    <circle cx="200" cy="530" r="8" fill="#000" stroke="#fff"/><text x="200" y="534">6</text>
    <circle cx="200" cy="560" r="8" fill="#000" stroke="#fff"/><text x="200" y="564">7</text>
    <circle cx="233" cy="623" r="8" fill="#000" stroke="#fff"/><text x="233" y="627">8</text>
    <circle cx="270" cy="304" r="8" fill="#000" stroke="#fff"/><text x="270" y="308">9</text>
    <circle cx="200" cy="702" r="8" fill="#000" stroke="#fff"/><text x="200" y="706">10</text>
  </g>
  <!-- legend -->
  <g font-size="9.5" fill="#ddd">
    <text x="8" y="70">1 Armoured prow + ram</text>
    <text x="8" y="84">2 Torpedo tubes</text>
    <text x="8" y="98">3 Dorsal lance turrets</text>
    <text x="8" y="112">4 Broadside gun decks</text>
    <text x="8" y="126">   (port + starboard)</text>
    <text x="8" y="140">5 Void shield generators</text>
    <text x="8" y="154">6 Hangar / launch bays</text>
    <text x="8" y="168">7 Bridge tower</text>
    <text x="8" y="182">8 Lord-General's quarters</text>
    <text x="8" y="196">   (est., below bridge)</text>
    <text x="8" y="210">9 Boarding airlocks (green)</text>
    <text x="8" y="224">10 Enginarium + plasma drive</text>
  </g>
  <g font-size="9" fill="#9fe0b4">
    <text x="272" y="560">Ways in:</text>
    <text x="272" y="573">- hangar bays (open</text>
    <text x="272" y="584">  for shuttles)</text>
    <text x="272" y="597">- 4 hull airlocks</text>
    <text x="272" y="610">- breach charge on</text>
    <text x="272" y="621">  a weak plate</text>
  </g>
  <text x="200" y="812" fill="#666" font-size="9" text-anchor="middle">Interior details from Halvard and Toll's knowledge of the class. Not to scale.</text>
</svg>
