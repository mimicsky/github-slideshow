    <text x="293" y="121">Torpedo tubes</text>
    <text x="293" y="233">Lance turret</text>
    <text x="293" y="293">Lance turret</text>
    <text x="293" y="397">Broadside guns</text>
    <text x="293" y="408">(starboard)</text>
    <text x="293" y="527">Hangar bay (stbd)</text>
    <text x="293" y="539" fill="#9fe0b4">(way in)</text>
