<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" font-family="Arial, sans-serif">
  <rect width="400" height="640" fill="#1b1d21"/>
  <!-- open sky edge -->
  <rect x="20" y="20" width="360" height="40" fill="#5b4a36"/>
  <text x="200" y="45" fill="#f2e3c9" font-size="14" text-anchor="middle">OPEN SKY (smog, drop-off)</text>
  <!-- bay floor -->
  <rect x="20" y="60" width="360" height="520" fill="#3a3d43" stroke="#888" stroke-width="2"/>
  <text x="240" y="594" fill="#bbb" font-size="11" text-anchor="middle">BACK WALL (spire)</text>
  <text x="12" y="320" fill="#bbb" font-size="12" text-anchor="middle" transform="rotate(-90 12 320)">LEFT WALL</text>
  <!-- ship -->
  <path d="M200 80 L240 140 L240 470 L160 470 L160 140 Z" fill="#8a9099" stroke="#d0d4da" stroke-width="2"/>
  <text x="200" y="300" fill="#111" font-size="14" font-weight="bold" text-anchor="middle">EMBER</text>
  <text x="200" y="318" fill="#111" font-size="12" text-anchor="middle">OF TYROK</text>
  <text x="200" y="128" fill="#111" font-size="11" text-anchor="middle">nose</text>
  <text x="200" y="462" fill="#111" font-size="11" text-anchor="middle">tail</text>
  <!-- gantries -->
  <rect x="20" y="180" width="140" height="12" fill="#c9a24a"/>
  <text x="90" y="174" fill="#e6d29a" font-size="11" text-anchor="middle">far gantry</text>
  <circle cx="160" cy="186" r="6" fill="#555" stroke="#fff"/>
  <text x="128" y="207" fill="#ddd" font-size="10" text-anchor="middle">hatch (shut)</text>
  <rect x="20" y="330" width="140" height="12" fill="#c9a24a"/>
  <text x="90" y="324" fill="#e6d29a" font-size="11" text-anchor="middle">near gantry</text>
  <circle cx="160" cy="336" r="7" fill="#e04b3c" stroke="#fff"/>
  <text x="248" y="334" fill="#ff8a7d" font-size="10">&#8592; MAIN HATCH (open)</text>
  <text x="262" y="347" fill="#ff8a7d" font-size="10">smoker ran in</text>
  <!-- umbilical -->
  <path d="M20 400 C 90 400, 120 420, 160 420" stroke="#4fb0c6" stroke-width="5" fill="none"/>
  <rect x="22" y="388" width="22" height="22" fill="#4fb0c6" stroke="#fff"/>
  <text x="70" y="440" fill="#9fdcea" font-size="11" text-anchor="middle">junction box</text>
  <text x="70" y="453" fill="#9fdcea" font-size="11" text-anchor="middle">+ umbilical</text>
  <!-- you -->
  <circle cx="62" cy="360" r="9" fill="#3fbf6a" stroke="#fff" stroke-width="2"/>
  <text x="62" y="364" fill="#000" font-size="10" font-weight="bold" text-anchor="middle">T</text>
  <circle cx="82" cy="372" r="9" fill="#3fbf6a" stroke="#fff" stroke-width="2"/>
  <text x="82" y="376" fill="#000" font-size="10" font-weight="bold" text-anchor="middle">V</text>
  <text x="300" y="80" fill="#fff" font-size="1"> </text>
  <!-- surrendered sentries -->
  <rect x="38" y="375" width="12" height="12" fill="#e8c547"/>
  <rect x="96" y="352" width="12" height="12" fill="#e8c547"/>
  <!-- cover -->
  <rect x="270" y="200" width="40" height="26" fill="#6b5a44"/><text x="290" y="217" fill="#eee" font-size="10" text-anchor="middle">crates</text>
  <circle cx="300" cy="262" r="12" fill="#6b5a44"/><circle cx="326" cy="262" r="12" fill="#6b5a44"/><text x="313" y="287" fill="#eee" font-size="10" text-anchor="middle">fuel drums</text>
  <rect x="80" y="480" width="50" height="22" fill="#6b5a44"/><text x="105" y="495" fill="#eee" font-size="10" text-anchor="middle">cart</text>
  <rect x="250" y="420" width="44" height="22" fill="#6b5a44"/><text x="272" y="435" fill="#eee" font-size="10" text-anchor="middle">crates</text>
  <!-- intake + team -->
  <rect x="40" y="568" width="90" height="14" fill="#1b1d21" stroke="#3fbf6a" stroke-width="2"/>
  <text x="85" y="594" fill="#9fe0b4" font-size="10" text-anchor="middle">CARGO INTAKE</text>
  <rect x="50" y="520" width="44" height="22" fill="#6b5a44"/><text x="72" y="535" fill="#eee" font-size="10" text-anchor="middle">cart</text>
  <g fill="#3fbf6a" stroke="#fff"><circle cx="58" cy="552" r="5"/><circle cx="72" cy="552" r="5"/><circle cx="86" cy="552" r="5"/><circle cx="100" cy="552" r="5"/><circle cx="114" cy="552" r="5"/></g>
  <text x="150" y="545" fill="#9fe0b4" font-size="10">your team (10)</text>
  <!-- tower -->
  <rect x="320" y="520" width="58" height="58" fill="#2b5b8a" stroke="#fff"/>
  <text x="349" y="545" fill="#fff" font-size="11" text-anchor="middle">TOWER</text>
  <text x="349" y="560" fill="#cfe3f7" font-size="9" text-anchor="middle">manned, 2 floors</text>
  <text x="349" y="572" fill="#ffb3a8" font-size="9" text-anchor="middle">hit the alarm</text>
  <line x1="320" y1="578" x2="300" y2="578" stroke="#fff" stroke-dasharray="3 2"/><text x="290" y="574" fill="#ddd" font-size="9" text-anchor="end">stair</text>
  <!-- legend -->
  <rect x="200" y="608" width="10" height="10" fill="#3fbf6a"/><text x="214" y="617" fill="#ddd" font-size="10">you: T Tamsin, V Varsaine</text>
  <rect x="20" y="608" width="10" height="10" fill="#e8c547"/><text x="34" y="617" fill="#ddd" font-size="10">sentries (surrendered)</text>
  <text x="200" y="634" fill="#999" font-size="9" text-anchor="middle">Spire Dock Six, top-down. Not to scale.</text>
</svg>
